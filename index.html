<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reel · Movie Log</title>
<style>
:root{--bg:#0f1218;--p:#171b24;--p2:#1e2330;--ln:#2a3040;--tx:#e9ecf3;--mu:#8e96a8;--ac:#7cd4ff;--gd:#ffcf5a;--bad:#ff7a86}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
h1,h2,h3,.logo{font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;font-weight:600;letter-spacing:-.01em}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#nav{position:sticky;top:0;z-index:20;display:flex;gap:18px;align-items:center;padding:12px 24px;background:rgba(15,18,24,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
#nav:empty{display:none}
.logo{font-size:22px}.logo i{color:var(--ac);font-style:normal}
#nav form{flex:1;max-width:420px}
#nav input{width:100%;padding:8px 14px;border-radius:99px;background:var(--p);border:1px solid var(--ln)}
.links{display:flex;gap:16px;margin-left:auto;color:var(--mu)}
.links a:hover,.links a.on{color:var(--tx)}
.wrap{max-width:1200px;margin:0 auto;padding:28px 24px 80px}
.mu{color:var(--mu)}.err{color:var(--bad)}
h2{font-size:26px;margin:28px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.card{position:relative;display:block}
.card img,.ph{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;background:var(--p2);display:block;transition:transform .15s}
.card:hover img{transform:translateY(-3px)}
.card b{display:block;margin-top:8px;font-weight:500;font-size:14px;line-height:1.3}
.card small{color:var(--mu)}
.tag{position:absolute;top:8px;right:8px;background:rgba(10,12,16,.85);color:var(--gd);padding:1px 8px;border-radius:99px;font-size:13px;font-weight:600}
.hero{position:relative;min-height:340px;display:flex;align-items:flex-end;background-size:cover;background-position:center 20%}
.hero:before,.bd:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg),rgba(15,18,24,.35) 70%,rgba(15,18,24,.6))}
.hero>div{position:relative;max-width:1200px;margin:0 auto;padding:0 24px 28px;width:100%}
.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.05;max-width:700px}
.hero p{max-width:560px;color:#c5cad6;margin:10px 0 16px}
.btn{display:inline-block;border:1px solid var(--ln);background:var(--p2);padding:8px 16px;border-radius:9px;cursor:pointer}
.btn:hover{border-color:var(--ac)}
.btn.pri{background:var(--ac);color:#08202c;border-color:var(--ac);font-weight:600}
.btn.s{padding:4px 12px;font-size:13px}
.btn.on{border-color:var(--gd);color:var(--gd)}
.seg{display:inline-flex;gap:6px;margin-left:12px;vertical-align:middle}
.bd{position:absolute;left:0;right:0;top:0;height:460px;background-size:cover;background-position:center 20%;z-index:-1}
.mv{position:relative;padding-top:230px}
.top{display:flex;gap:28px;align-items:flex-end}
.pw{width:230px;flex:none;display:flex;flex-direction:column;gap:8px}
.pw img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.6);background:var(--p2)}
.info h1{font-size:clamp(28px,4vw,44px);line-height:1.08}
.info h1 span{color:var(--mu);font-weight:400}
.meta{margin:10px 0;color:#c5cad6;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cert{border:1px solid var(--mu);border-radius:4px;padding:0 6px;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips span{background:var(--p2);border:1px solid var(--ln);border-radius:99px;padding:2px 12px;font-size:13px}
.chips.g span{border-color:var(--ac);color:var(--ac);background:none}
.ov{max-width:70ch;color:#c5cad6;margin:12px 0}
.panel{background:var(--p);border:1px solid var(--ln);border-radius:14px;padding:22px;margin-top:28px}
.panel h3{font-size:20px;margin-bottom:12px}
.row{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input,textarea{background:var(--bg);border:1px solid var(--ln);border-radius:9px;padding:8px 12px}
textarea{width:100%;min-height:70px;resize:vertical}
input[type=range]{accent-color:var(--gd);flex:1;min-width:200px;padding:0}
.rv{font:600 30px Georgia,serif;color:var(--gd);min-width:70px}
.pill{color:var(--ac);font-weight:500}
.li{display:flex;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln)}
.li img{width:44px;aspect-ratio:2/3;object-fit:cover;border-radius:5px}
.li div{flex:1}.li .r{color:var(--gd);font-weight:600;flex:none}
.x{background:none;border:0;color:var(--mu);cursor:pointer;font-size:18px}.x:hover{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.stats .panel{margin:0}.stats big{display:block;font:600 34px Georgia,serif;color:var(--ac)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-top:14px}
.br{display:flex;gap:10px;align-items:center;font-size:13px;margin:5px 0}
.br span{width:84px;color:var(--mu)}.br i{flex:1;height:8px;background:var(--p2);border-radius:4px;overflow:hidden}
.br b{display:block;height:100%;background:var(--ac)}.br em{width:24px;font-style:normal}
#modal{position:fixed;inset:0;z-index:50;background:rgba(5,7,10,.85);display:none;overflow:auto;padding:30px 16px}
#modal.on{display:block}
#modal>div{max-width:1000px;margin:0 auto;background:var(--p);border:1px solid var(--ln);border-radius:16px;padding:22px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:14px 0}
.pg.b{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.pg img{width:100%;border-radius:8px;cursor:pointer;border:2px solid transparent;display:block}
.pg img:hover{border-color:var(--ac)}
.auth{max-width:380px;margin:12vh auto;padding:0 20px;text-align:center}
.auth h1{font-size:46px}.auth form{display:grid;gap:10px;margin:22px 0 10px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--p2);border:1px solid var(--ac);padding:10px 20px;border-radius:99px;z-index:99;display:none}
@media(max-width:700px){.top{flex-direction:column;align-items:flex-start}.pw{width:150px}.mv{padding-top:150px}#nav{flex-wrap:wrap;padding:10px 14px}.links{margin:0;width:100%;overflow:auto}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div id="nav"></div><main id="app"></main><div id="modal"></div><div id="toast"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),app=$('#app'),LS=localStorage;
const J=(k,d)=>{try{return JSON.parse(LS.getItem(k))??d}catch{return d}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let users=J('mt_u',[]),cur=LS.getItem('mt_c'),D=null,P=null,tt;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',2400)};
const save=()=>{try{LS.setItem('mt_d_'+cur,JSON.stringify(D));return true}catch{toast('Storage full. Use smaller images or remove some.');return false}};
const IM='https://image.tmdb.org/t/p/';
const img=(p,s='w500')=>!p?'':p[0]=='/'?IM+s+p:p;
const wrap=h=>`<div class=wrap>${h}</div>`;
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const hm=m=>m?`${Math.floor(m/60)}h ${m%60}m`:'';
function info(s){const[y,m,d]=s.split('-').map(Number),t=new Date(Date.UTC(y,m-1,d)),wd=t.toLocaleDateString('en',{weekday:'long',timeZone:'UTC'}),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);return{wd,wk:Math.ceil(((t-Date.UTC(t.getUTCFullYear(),0,1))/864e5+1)/7)}}
/* ---------- accounts: stored only in this browser, passwords PBKDF2-hashed ---------- */
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
async function hash(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:150000,hash:'SHA-256'},k,256))}
function authView(reg){$('#nav').innerHTML='';app.innerHTML=`<div class=auth><h1>Reel</h1><p class=mu>Your film diary. Accounts and logs stay in this browser. Nothing is uploaded.</p>
<form onsubmit="return auth(event,${!!reg})"><input id=un placeholder="Username" autocomplete=username required><input id=pw type=password placeholder="Password" autocomplete="${reg?'new':'current'}-password" minlength=${reg?6:1} required><button class="btn pri">${reg?'Create account':'Sign in'}</button></form>
<a class=mu href=# onclick="authView(${!reg});return false">${reg?'Have an account? Sign in':'New here? Create an account'}</a><p id=ae class=err></p></div>`}
async function auth(e,reg){e.preventDefault();const n=$('#un').value.trim().toLowerCase(),pw=$('#pw').value,u=users.find(x=>x.n==n);
 if(reg){if(u)return $('#ae').textContent='That username is taken.';const salt=b64(crypto.getRandomValues(new Uint8Array(16)));const nu={id:'u'+Date.now(),n,salt,h:await hash(pw,salt)};users.push(nu);localStorage.setItem('mt_u',JSON.stringify(users));LS.setItem('mt_d_'+nu.id,JSON.stringify({key:'',logs:[],watch:[],ov:{}}));login(nu.id)}
 else{if(!u||await hash(pw,u.salt)!=u.h)return $('#ae').textContent='Wrong username or password.';login(u.id)}return false}
function login(id){cur=id;LS.setItem('mt_c',id);D=J('mt_d_'+id,{key:'',logs:[],watch:[],ov:{}});location.hash='#/';route()}
function logout(){LS.removeItem('mt_c');cur=D=null;authView()}
/* ---------- TMDb ---------- */
async function api(path,q={}){if(!D.key)throw new Error('Add your TMDb API key in Settings to get started.');
 const u=new URL('https://api.themoviedb.org/3'+path);for(const k in q)u.searchParams.set(k,q[k]);const o={};
 if(D.key.length>40)o.headers={Authorization:'Bearer '+D.key};else u.searchParams.set('api_key',D.key);
 const r=await fetch(u,o);if(!r.ok)throw new Error(r.status==401?'TMDb rejected that API key.':'TMDb error '+r.status);return r.json()}
/* ---------- views ---------- */
const nav=()=>{const h=location.hash.split('/')[1]||'';$('#nav').innerHTML=`<a class=logo href=#/>Reel<i>.</i></a><form onsubmit="location.hash='#/search/'+encodeURIComponent($('#q').value);return false"><input id=q placeholder="Search films"></form><div class=links>${[['','Home'],['diary','Diary'],['watchlist','Watchlist'],['stats','Stats'],['settings',esc(users.find(u=>u.id==cur)?.n||'Me')]].map(([k,v])=>`<a href="#/${k}" class="${h==k?'on':''}">${v}</a>`).join('')}</div>`};
async function route(){if(!D)return authView();nav();scrollTo(0,0);const[,p,a]=location.hash.split('/');
 try{await({'':home,movie,search,diary,watchlist,stats,settings}[p||'']||home)(a)}catch(e){app.innerHTML=wrap(`<p class=err>${esc(e.message)}</p>${/key/i.test(e.message)?'<a class="btn pri" href=#/settings>Open settings</a>':''}`)}}
const card=m=>{const L=D.logs.filter(l=>l.mid==m.id).sort((a,b)=>b.date.localeCompare(a.date))[0],p=(D.ov[m.id]||{}).poster||m.poster_path;
 return`<a class=card href=#/movie/${m.id}>${p?`<img loading=lazy src="${esc(img(p,'w342'))}" alt="">`:'<div class=ph></div>'}${L?`<span class=tag>★ ${L.rating}</span>`:''}<b>${esc(m.title)}</b><small>${(m.release_date||'').slice(0,4)}</small></a>`};
const grid=l=>`<div class=grid>${l.map(card).join('')}</div>`;
async function home(){const w=sessionStorage.w||'week',t=await api('/trending/movie/'+w),h=t.results.find(m=>m.backdrop_path)||t.results[0];
 const rec=D.logs.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6).map(l=>({id:l.mid,title:l.s.title,poster_path:l.s.poster,release_date:l.s.year}));
 app.innerHTML=`<div class=hero style="background-image:url(${esc(img((D.ov[h.id]||{}).backdrop||h.backdrop_path,'w1280'))})"><div><h1>${esc(h.title)}</h1><p>${esc(h.overview.slice(0,200))}${h.overview.length>200?'…':''}</p><a class="btn pri" href=#/movie/${h.id}>Open film</a></div></div>
 <div class=wrap>${rec.length?`<h2>Recently logged</h2>${grid(rec)}`:''}<h2>Trending <span class=seg>${['day','week'].map(x=>`<button class="btn s ${x==w?'on':''}" onclick="sessionStorage.w='${x}';route()">${x=='day'?'Today':'This week'}</button>`).join('')}</span></h2>${grid(t.results)}</div>`}
async function search(q){q=decodeURIComponent(q||'');const r=await api('/search/movie',{query:q,include_adult:false});app.innerHTML=wrap(`<h2>Results for “${esc(q)}”</h2>${r.results.length?grid(r.results):'<p class=mu>No films found. Try another title.</p>'}`)}
async function movie(id){const m=await api('/movie/'+id,{append_to_response:'credits,release_dates,images',include_image_language:'en,null'});
 const us=m.release_dates.results.find(r=>r.iso_3166_1=='US'),cert=(us?.release_dates||[]).map(x=>x.certification).find(Boolean)||'NR';
 const s={id:m.id,title:m.title,year:(m.release_date||'').slice(0,4),director:m.credits.crew.filter(c=>c.job=='Director').map(c=>c.name).join(', '),cast:m.credits.cast.slice(0,16).map(c=>c.name),genres:m.genres.map(g=>g.name),runtime:m.runtime,cert,poster:m.poster_path,backdrop:m.backdrop_path};
 P={s,imgs:{poster:m.images.posters,backdrop:m.images.backdrops}};
 const o=D.ov[id]||{},po=o.poster||s.poster,bo=o.backdrop||s.backdrop,own=D.logs.filter(l=>l.mid==id).sort((a,b)=>b.date.localeCompare(a.date)),inW=D.watch.some(w=>w.id==id),i=info(today());
 app.innerHTML=`<div class=bd style="background-image:url(${esc(img(bo,'w1280'))})"></div><div class="wrap mv"><div class=top>
 <div class=pw><img src="${esc(img(po,'w500'))}" alt=""><button class="btn s" onclick="pick('poster')">Change poster</button></div>
 <div class=info><h1>${esc(s.title)} <span>${s.year}</span></h1><div class=meta><span class=cert>${esc(cert)}</span><span>${hm(s.runtime)||'Runtime n/a'}</span><span>Directed by ${esc(s.director||'unknown')}</span></div>
 <div class="chips g">${s.genres.map(g=>`<span>${esc(g)}</span>`).join('')}</div><p class=ov>${esc(m.overview)}</p>
 <div class=chips>${s.cast.map(c=>`<span>${esc(c)}</span>`).join('')}</div>
 <div class=row><button class="btn s" onclick="pick('backdrop')">Change backdrop</button><button class="btn s ${inW?'on':''}" onclick="wl()">${inW?'On watchlist':'Add to watchlist'}</button></div></div></div>
 <div class=panel><h3>Log this film</h3><div class=row><label>Date watched <input type=date id=dt value="${today()}" max="${today()}" oninput="dinfo()"></label><span class=pill id=di>${i.wd}, week ${i.wk}</span><label><input type=checkbox id=rw> Rewatch</label></div>
 <div class=row><span class=rv id=rv>7</span><input type=range id=rt min=.5 max=10 step=.5 value=7 oninput="$('#rv').textContent=this.value" aria-label="Rating"></div>
 <textarea id=nt placeholder="Thoughts (optional)"></textarea><div class=row style="margin:14px 0 0"><button class="btn pri" onclick="logIt()">Log film</button></div></div>
 ${own.length?`<div class=panel><h3>Your logs</h3>${own.map(logRow).join('')}</div>`:''}</div>`}
const dinfo=()=>{const v=$('#dt').value;if(v){const i=info(v);$('#di').textContent=`${i.wd}, week ${i.wk}`}};
function logIt(){const date=$('#dt').value;if(!date)return toast('Pick a date first.');const i=info(date);
 D.logs.push({id:Date.now(),mid:P.s.id,date,wd:i.wd,wk:i.wk,rating:+$('#rt').value,note:$('#nt').value.trim(),rw:$('#rw').checked,s:P.s});D.watch=D.watch.filter(w=>w.id!=P.s.id);if(save()){toast('Logged');route()}}
function wl(){const id=P.s.id;D.watch=D.watch.some(w=>w.id==id)?D.watch.filter(w=>w.id!=id):[...D.watch,P.s];save();route()}
function del(id){if(confirm('Delete this log?')){D.logs=D.logs.filter(l=>l.id!=id);save();route()}}
const logRow=l=>`<div class=li><a href=#/movie/${l.mid}><img loading=lazy src="${esc(img((D.ov[l.mid]||{}).poster||l.s.poster,'w185'))}" alt=""></a><div><a href=#/movie/${l.mid}><b>${esc(l.s.title)}</b> <span class=mu>${l.s.year}</span></a><br><small class=mu>${l.wd}, ${l.date} · week ${l.wk}${l.rw?' · rewatch':''}</small>${l.note?`<br><small>${esc(l.note)}</small>`:''}</div><span class=r>★ ${l.rating}</span><button class=x onclick="del(${l.id})" aria-label="Delete log">✕</button></div>`;
function diary(){const L=D.logs.slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);let mo='',h='';
 for(const l of L){const m=new Date(l.date+'T00:00').toLocaleDateString('en',{month:'long',year:'numeric'});if(m!=mo){mo=m;h+=`<h2>${m}</h2>`}h+=logRow(l)}
 app.innerHTML=wrap(`<h1>Diary</h1>${h||'<p class=mu>Nothing logged yet. Find a film on the home page and log it.</p>'}`)}
function watchlist(){app.innerHTML=wrap(`<h1>Watchlist</h1><br>${D.watch.length?grid(D.watch.map(s=>({id:s.id,title:s.title,poster_path:s.poster,release_date:s.year}))):'<p class=mu>Your watchlist is empty. Add films from their pages.</p>'}`)}
function stats(){const L=D.logs;if(!L.length)return app.innerHTML=wrap('<h1>Stats</h1><p class=mu>Log a few films to see your stats.</p>');
 const mins=L.reduce((a,l)=>a+(l.s.runtime||0),0),avg=L.reduce((a,l)=>a+l.rating,0)/L.length;
 const cnt=f=>{const o={};L.forEach(l=>[].concat(f(l)).forEach(k=>o[k]=(o[k]||0)+1));return o};
 const bars=(o,keys)=>{keys=keys||Object.keys(o).sort((a,b)=>o[b]-o[a]).slice(0,8);const mx=Math.max(...keys.map(k=>o[k]||0),1);return keys.map(k=>`<div class=br><span>${esc(k)}</span><i><b style="width:${(o[k]||0)/mx*100}%"></b></i><em>${o[k]||0}</em></div>`).join('')};
 const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
 app.innerHTML=wrap(`<h1>Stats</h1><br><div class=stats>${[[L.length,'films logged'],[Math.round(mins/60),'hours watched'],[avg.toFixed(1),'average rating'],[new Set(L.map(l=>l.date)).size,'days with a film']].map(([a,b])=>`<div class=panel><big>${a}</big>${b}</div>`).join('')}</div>
 <div class=two><div class=panel><h3>Ratings</h3>${bars(cnt(l=>l.rating),Array.from({length:20},(_,i)=>String((i+1)/2)))}</div><div class=panel><h3>Weekdays</h3>${bars(cnt(l=>l.wd),days)}<h3 style="margin-top:18px">Top genres</h3>${bars(cnt(l=>l.s.genres))}</div></div>`)}
function settings(){app.innerHTML=wrap(`<h1>Settings</h1><div class=panel><h3>TMDb API key</h3><p class=mu>Paste your v3 API key or v4 read access token from themoviedb.org/settings/api. It is saved only in this browser, under your account.</p><br><div class=row><input id=ky type=password style="flex:1;min-width:240px" value="${esc(D.key)}" placeholder="API key"><button class="btn pri" onclick="saveKey()">Save and test</button></div></div>
 <div class=panel><h3>Your data</h3><p class=mu>Logs live in this browser only. Export a backup to move them to another device.</p><br><div class=row><button class=btn onclick="exp()">Export backup</button><label class=btn>Import backup<input type=file accept=.json hidden onchange="imp(this.files[0])"></label></div></div>
 <div class=panel><h3>Account</h3><div class=row><button class=btn onclick="logout()">Sign out</button><button class=btn onclick="delAcc()" style="color:var(--bad)">Delete account and data</button></div></div>`)}
async function saveKey(){D.key=$('#ky').value.trim();save();try{await api('/configuration');toast('Key works')}catch(e){toast(e.message)}}
function exp(){const{key,...r}=D,a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(r)],{type:'application/json'}));a.download='reel-backup.json';a.click()}
async function imp(f){try{const r=JSON.parse(await f.text());if(!Array.isArray(r.logs))throw 0;D={...D,logs:r.logs,watch:r.watch||[],ov:r.ov||{}};save();toast('Imported');route()}catch{toast('That file is not a Reel backup.')}}
function delAcc(){if(confirm('Delete this account and all its logs? This cannot be undone.')){users=users.filter(u=>u.id!=cur);LS.setItem('mt_u',JSON.stringify(users));LS.removeItem('mt_d_'+cur);logout()}}
/* ---------- image picker ---------- */
function pick(k,tab){const L=(P.imgs[k]||[]).slice(0,60),b=k=='backdrop';
 $('#modal').innerHTML=`<div><div class=row><h3 style="flex:1">Choose a ${k}</h3><button class="btn s" onclick="closeM()">Close</button></div>
 <div class=row><input id=ul placeholder="Paste an image link" style="flex:1;min-width:220px"><button class="btn s" onclick="useUrl('${k}')">Use link</button><label class="btn s">Upload photo<input type=file accept="image/*" hidden onchange="upl('${k}',this.files[0])"></label><button class="btn s" onclick="setImg('${k}',null)">Reset to default</button></div>
 <div class="pg ${b?'b':''}">${L.map(i=>`<img loading=lazy src="${IM}${b?'w300':'w185'}${i.file_path}" onclick="setImg('${k}','${i.file_path}')" alt="">`).join('')||'<p class=mu>TMDb has no alternatives. Paste a link or upload instead.</p>'}</div></div>`;$('#modal').classList.add('on')}
const closeM=()=>$('#modal').classList.remove('on');
function setImg(k,v){const id=P.s.id;D.ov[id]=D.ov[id]||{};if(v)D.ov[id][k]=v;else delete D.ov[id][k];if(save()){closeM();route()}}
function useUrl(k){const u=$('#ul').value.trim();if(!/^https?:\/\//.test(u))return toast('Enter a full link starting with https://');setImg(k,u)}
function upl(k,f){if(!f)return;const i=new Image();i.onload=()=>{const w=k=='backdrop'?1280:500,s=Math.min(1,w/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);setImg(k,c.toDataURL('image/jpeg',.82))};i.src=URL.createObjectURL(f)}
