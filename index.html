<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FilmStack</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--sf:#171a22;--tx:#eef0f5;--mu:#8b93a7;--ac:#7c5cff;--ax:#fff;--gd:#f5c518;--ln:color-mix(in srgb,var(--tx) 12%,transparent)}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}.mu,small{color:var(--mu)}
header{position:sticky;top:0;z-index:20;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 24px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.logo{font-weight:800;font-size:22px;letter-spacing:-1px}.logo b{color:var(--ac)}
nav{display:flex;gap:4px;flex:1}nav a{padding:6px 12px;border-radius:99px;color:var(--mu);font-weight:500}nav a.on,nav a:hover{color:var(--tx);background:var(--ln)}
input,select,textarea{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;outline:0;max-width:100%}input:focus,textarea:focus,select:focus{border-color:var(--ac)}
.btn,.tabs button{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-block}.btn:hover{border-color:var(--ac)}.btn.p,.tabs .on{background:var(--ac);color:var(--ax);border-color:var(--ac)}
.tabs{display:inline-flex;gap:6px;margin:6px 8px 6px 0}.tabs button{padding:6px 14px;border-radius:99px}
#app{position:relative;z-index:0;min-height:80vh}main{max-width:1180px;margin:0 auto;padding:24px}.nar{max-width:760px}
.bd{position:absolute;inset:0 0 auto;height:480px;background-size:cover;background-position:center 20%;opacity:.5;z-index:-1;-webkit-mask:linear-gradient(#000 30%,transparent);mask:linear-gradient(#000 30%,transparent)}
h1{font-size:34px;letter-spacing:-1px;line-height:1.15}h2{font-size:18px;margin:28px 0 12px}h3{margin-bottom:10px}
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{position:relative;flex:0 0 150px;min-width:0}.card img,.ph{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:var(--sf);display:block;transition:transform .2s}.card:hover img{transform:translateY(-4px)}
.ct{font-weight:600;font-size:14px;margin-top:6px;line-height:1.3}.hb{position:absolute;top:8px;right:8px;background:#000a;color:#ff4d6d;border-radius:99px;padding:0 7px}
.dp{display:flex;gap:28px;padding-top:70px}.pst{width:240px;height:360px;object-fit:cover;border-radius:14px;box-shadow:0 20px 50px #0008;background:var(--sf)}
.chip{display:inline-block;border:1px solid var(--ln);border-radius:99px;padding:2px 12px;margin:0 6px 6px 0;font-size:13px}
.stars{display:inline-flex}.stars i{font-style:normal;font-size:20px;background:linear-gradient(90deg,var(--gd) var(--f),color-mix(in srgb,var(--tx) 20%,transparent) var(--f));-webkit-background-clip:text;background-clip:text;color:transparent}.big i{font-size:29px;cursor:pointer}
.cast{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}.cm{flex:0 0 112px;text-align:center}.cm img,.cm .ph{width:112px;height:112px;border-radius:50%;object-fit:cover;aspect-ratio:1;background:var(--sf)}.cm div{font-size:13px;font-weight:600;margin-top:6px}.cm small{font-size:12px;display:block}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px;margin-bottom:16px}.lg{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--ln)}.lg:last-child{border:0}.lg>div{flex:1;min-width:160px}
.ov{position:fixed;inset:0;background:#000a;z-index:50;display:grid;place-items:center;padding:16px}.mb{background:var(--bg);border:1px solid var(--ln);border-radius:18px;padding:22px;width:560px;max-width:100%;max-height:90vh;overflow:auto}
.mb label{display:block;margin:12px 0 4px;color:var(--mu);font-size:13px}.mb input:not([type=file]),.mb textarea{width:100%}.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.acts2{display:flex;gap:8px;flex-wrap:wrap}.acts2 input{flex:1;min-width:140px}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin:12px 0}.ig.backdrop{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.ig img{width:100%;border-radius:8px;cursor:pointer;border:2px solid transparent}.ig img:hover{border-color:var(--ac)}.or{text-align:center;color:var(--mu);margin:10px}
.auth{max-width:380px;margin:12vh auto;padding:0 20px;text-align:center}.auth form{display:grid;gap:10px;margin-top:16px}.auth .logo{font-size:44px;display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--ax);padding:10px 18px;border-radius:99px;z-index:99;font-weight:600}
.ld,.err{padding:60px 24px;text-align:center;color:var(--mu)}.err{color:var(--tx)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:16px 0}.tile{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px}.tile b{font-size:26px;display:block;letter-spacing:-.5px}.tile span{color:var(--mu);font-size:13px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}.g2 .panel{margin:0}.hist{display:flex;align-items:flex-end;gap:3px;height:150px}.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;color:var(--mu)}.col i{width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}.col span{height:16px;margin-top:4px}
.rk{display:grid;grid-template-columns:minmax(80px,1.2fr) 2fr 28px;gap:10px;align-items:center;margin:6px 0;font-size:14px}.rk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk u{height:8px;background:var(--ln);border-radius:9px;overflow:hidden}.rk u i{display:block;height:100%;background:var(--ac)}.rk b{text-align:right}
.mini{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}.mini a{position:relative}.mini img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px}.bdg{position:absolute;bottom:4px;left:4px;background:#000b;color:var(--gd);font-size:11px;padding:0 6px;border-radius:99px}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.swb{background:var(--sf);border:2px solid var(--ln);border-radius:12px;padding:8px;cursor:pointer;text-align:left}.swb.on{border-color:var(--ac)}.swb span{display:flex;height:18px;border-radius:6px;overflow:hidden;margin-bottom:6px}.swb i{flex:1}
.cp{display:flex;gap:14px;flex-wrap:wrap}.cp label{display:grid;gap:4px;color:var(--mu);font-size:13px}.cp input{height:40px;width:80px;padding:2px}
.mh{font-size:13px;font-weight:700;margin:22px 0 6px;color:var(--mu)}
@media(max-width:700px){header{padding:10px 14px}.dp{flex-direction:column;align-items:center;padding-top:40px}.pst{width:200px;height:300px}main{padding:16px}.big i{font-size:24px}}
</style></head><body>
<header><a class="logo" href="#/">film<b>stack</b></a><nav><a href="#/">Home</a><a href="#/diary">Diary</a><a href="#/favs">Favorites</a><a href="#/stats">Stats</a></nav><form onsubmit="return srch()"><input id="q" placeholder="Search movies & TV…"></form><a class="btn" href="#/settings" id="ub"></a></header>
<div id="app"></div><div id="md"></div>
<script>
const $=s=>document.querySelector(s),LS=localStorage,IMG='https://image.tmdb.org/t/p/',W=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TH={Midnight:['#0d0f14','#171a22','#eef0f5','#8b93a7','#7c5cff'],Letterboxd:['#14181c','#202830','#e4ecf3','#8899aa','#00e054'],Noir:['#000000','#121212','#ffffff','#888888','#e50914'],Sunset:['#1a0f1f','#2a1630','#ffeede','#b99aa8','#ff7a45'],Ocean:['#08141f','#0f2433','#e6f4ff','#7fa3bd','#2ec4ff'],Forest:['#0e1511','#17221b','#e8f3ea','#86a08d','#5fd38d'],Rose:['#1c1117','#2a1a22','#fdeef3','#b896a4','#ff5c8a'],Dracula:['#282a36','#343746','#f8f8f2','#9aa0c0','#bd93f9'],Nord:['#2e3440','#3b4252','#eceff4','#9aa5b8','#88c0d0'],Gold:['#121008','#1d1a0e','#f7f1dc','#a39b78','#f5c518'],Paper:['#f5f2ec','#ffffff','#1c1b1a','#6f6a60','#d9480f'],Light:['#f4f6fb','#ffffff','#12151c','#667085','#5b45ef']};
let U=LS.fs_session||null,D=null,M=null,mode='in',ST=0,LG=null,IT='poster',IM=null,DF='all',SS={sc:'y',ty:'all',yr:null};
const users=()=>JSON.parse(LS.fs_users||'{}'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),key=()=>M.type+':'+M.id;
const load=()=>{D=JSON.parse(LS['fs_d_'+U]||'null')||{key:'',theme:'Midnight',custom:[...TH.Midnight],items:{}}};
const save=()=>{try{LS['fs_d_'+U]=JSON.stringify(D)}catch(e){toast('Storage full: remove uploaded images or export your data')}};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2800)};
const modal=h=>{$('#md').innerHTML=h?`<div class="ov" onclick="if(event.target==this)modal()"><div class="mb">${h}</div></div>`:''};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const wk=d=>{const t=new Date(d+'T12:00Z'),n=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-n+3);const f=new Date(Date.UTC(t.getUTCFullYear(),0,4));return 1+Math.round(((t-f)/864e5-3+(f.getUTCDay()+6)%7)/7)};
const wd=d=>W[new Date(d+'T12:00Z').getUTCDay()];
function applyTheme(){const t=D?(D.theme=='Custom'?D.custom:TH[D.theme]||TH.Midnight):TH.Midnight,r=document.documentElement.style;['bg','sf','tx','mu','ac'].forEach((k,i)=>r.setProperty('--'+k,t[i]));const[R,G,B]=[1,3,5].map(i=>parseInt(t[4].substr(i,2),16));r.setProperty('--ax',R*.299+G*.587+B*.114>150?'#000':'#fff')}
async function hash(p,s){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(s),iterations:150000,hash:'SHA-256'},k,256);return btoa(String.fromCharCode(...new Uint8Array(b)))}
async function api(p,q=''){if(!D.key)throw Error('Add your TMDb API key in Settings to load movies and shows.');const bear=D.key.length>40,r=await fetch('https://api.themoviedb.org/3'+p+'?'+(bear?'':'api_key='+D.key+'&')+q,bear?{headers:{Authorization:'Bearer '+D.key}}:{});if(!r.ok)throw Error(r.status==401?'TMDb rejected your API key. Check it in Settings.':'TMDb error '+r.status);return r.json()}
/* auth */
function authView(){$('header').style.display='none';$('#app').innerHTML=`<div class="auth"><a class="logo">film<b>stack</b></a><p class="mu">Log every film and show you watch.</p><div class="tabs"><button class="${mode=='in'?'on':''}" onclick="mode='in';authView()">Sign in</button><button class="${mode=='up'?'on':''}" onclick="mode='up';authView()">Create account</button></div><form onsubmit="auth(event)"><input id="u" placeholder="Username" autocomplete="username"><input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="${mode=='in'?'current':'new'}-password"><button class="btn p">${mode=='in'?'Sign in':'Create account'}</button></form><p class="mu" style="margin-top:16px;font-size:13px">Accounts live only in this browser. Passwords are salted and hashed; nothing is sent anywhere.</p></div>`}
async function auth(e){e.preventDefault();const u=$('#u').value.trim().toLowerCase(),p=$('#pw').value,us=users();if(u.length<2||p.length<6)return toast('Username 2+ characters, password 6+');
if(mode=='up'){if(us[u])return toast('That username is taken');const s=crypto.randomUUID();us[u]={s,h:await hash(p,s)};LS.fs_users=JSON.stringify(us)}else if(!us[u]||us[u].h!=await hash(p,us[u].s))return toast('Wrong username or password');
U=u;LS.fs_session=u;load();boot()}
const boot=()=>{applyTheme();$('header').style.display='';$('#ub').textContent=U;route()};
const out=()=>{LS.removeItem('fs_session');U=D=null;applyTheme();route()};
/* helpers */
const stars=(r,i)=>[...Array(10)].map((_,j)=>`<i ${i?`onclick="sc(event,${j+1})"`:''} style="--f:${r>=j+1?100:r>=j+.5?50:0}%">★</i>`).join('');
const norm=(r,t)=>({id:r.id,type:t||r.media_type,title:r.title||r.name,year:(r.release_date||r.first_air_date||'').slice(0,4),poster:r.poster_path});
const card=it=>{const s=D.items[it.type+':'+it.id],u=s?.poster||(it.poster?(it.poster[0]=='/'?IMG+'w342'+it.poster:it.poster):'');return`<a class="card" href="#/${it.type}/${it.id}">${u?`<img loading="lazy" src="${esc(u)}">`:'<div class="ph"></div>'}${s?.fav?'<span class="hb">♥</span>':''}<div class="ct">${esc(it.title)}</div><small>${it.year||''}${s?.logs?.length?' · ✓ logged':''}</small></a>`};
const allLogs=()=>{const a=[];for(const it of Object.values(D.items))for(const l of it.logs||[])a.push({...it,...l});return a};
/* routing */
async function route(){if(!U)return authView();const[,p='',a]=location.hash.split('/');document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',x.getAttribute('href')=='#/'+p));$('#app').innerHTML='<div class="ld">Loading…</div>';scrollTo(0,0);
try{if(p=='movie'||p=='tv'){M=await detail(p,a);dview()}else if(p=='search')await search(decodeURIComponent(a||''));else if(p=='diary')diary();else if(p=='favs')favs();else if(p=='stats')stats();else if(p=='settings')settings();else await home()}
catch(e){$('#app').innerHTML=`<main><div class="err">${esc(e.message)}<br><br>${D.key?'':'<a class="btn p" href="#/settings">Open settings</a>'}</div></main>`}}
addEventListener('hashchange',route);
const srch=()=>{location.hash='#/search/'+encodeURIComponent($('#q').value);return false};
/* home & search */
async function home(){const[m,t]=await Promise.all([api('/trending/movie/week'),api('/trending/tv/week')]),f=m.results[0],rec=Object.values(D.items).filter(i=>i.logs?.length).sort((a,b)=>b.logs.map(l=>l.date).sort().pop().localeCompare(a.logs.map(l=>l.date).sort().pop())).slice(0,12);
$('#app').innerHTML=`<div class="bd" style="background-image:url(${IMG}w1280${f.backdrop_path})"></div><main><div style="padding:50px 0 10px"><h1>Trending this week</h1><p class="mu">Welcome back, ${esc(U)}. Find something to log.</p></div>${rec.length?`<h2>Recently logged</h2><div class="row">${rec.map(card).join('')}</div>`:''}<h2>Trending movies</h2><div class="row">${m.results.map(r=>card(norm(r,'movie'))).join('')}</div><h2>Trending TV shows</h2><div class="row">${t.results.map(r=>card(norm(r,'tv'))).join('')}</div></main>`}
async function search(q){const r=(await api('/search/multi','query='+encodeURIComponent(q))).results.filter(x=>x.media_type!='person');$('#app').innerHTML=`<main><h1>Results for “${esc(q)}”</h1><br><div class="grid">${r.map(x=>card(norm(x))).join('')||'<p class="mu">Nothing found.</p>'}</div></main>`}
/* detail */
async function detail(type,id){const m=type=='movie',d=await api(`/${type}/${id}`,'append_to_response=credits,'+(m?'release_dates':'content_ratings'));let cert='';
try{cert=m?d.release_dates.results.find(x=>x.iso_3166_1=='US').release_dates.find(x=>x.certification).certification:d.content_ratings.results.find(x=>x.iso_3166_1=='US').rating}catch(e){}
return{id:+id,type,title:d.title||d.name,year:(d.release_date||d.first_air_date||'').slice(0,4),dir:m?d.credits.crew.filter(c=>c.job=='Director').map(c=>c.name):(d.created_by||[]).map(c=>c.name),cast:d.credits.cast.slice(0,20).map(c=>({n:c.name,ch:c.character,p:c.profile_path})),genres:d.genres.map(g=>g.name),rt:m?d.runtime:(d.episode_run_time?.[0]||d.last_episode_to_air?.runtime||0),eps:d.number_of_episodes||0,seasons:d.number_of_seasons||0,cert,tag:d.tagline||'',ov:d.overview||'',poster:d.poster_path?IMG+'w500'+d.poster_path:'',backdrop:d.backdrop_path?IMG+'w1280'+d.backdrop_path:''}}
function ens(){const o=D.items[key()]||{logs:[],fav:0};D.items[key()]={...o,...M,poster:o.poster||M.poster,backdrop:o.backdrop||M.backdrop}}
function dview(){const m=M,s=D.items[key()]||{},logs=(s.logs||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)),rt=logs.find(l=>l.rating),
len=m.type=='movie'?(m.rt?Math.floor(m.rt/60)+'h '+m.rt%60+'m':''):[m.rt&&m.rt+'m per episode',m.seasons&&m.seasons+' season'+(m.seasons>1?'s':''),m.eps&&m.eps+' episodes'].filter(Boolean).join(', ');
$('#app').innerHTML=`<div class="bd" style="background-image:url(${esc(s.backdrop||m.backdrop)})"></div><main><div class="dp"><img class="pst" src="${esc(s.poster||m.poster)}"><div><h1>${esc(m.title)} <small>${m.year}</small></h1><p class="mu" style="margin:6px 0 12px">${m.type=='movie'?'Directed by':'Created by'} <b style="color:var(--tx)">${esc(m.dir.join(', ')||'Unknown')}</b>${len?' · '+len:''}${m.cert?' · '+esc(m.cert):''} · ${m.type=='tv'?'TV show':'Movie'}</p><div>${m.genres.map(g=>`<span class="chip">${esc(g)}</span>`).join('')}</div>${m.tag?`<p class="mu" style="font-style:italic;margin:8px 0">${esc(m.tag)}</p>`:''}<p style="max-width:62ch;margin:8px 0 16px">${esc(m.ov)}</p>
<div class="acts2"><button class="btn p" onclick="logM()">+ Log ${m.type=='tv'?'show':'film'}</button><button class="btn" onclick="fav()" style="color:${s.fav?'#ff4d6d':'inherit'}">${s.fav?'♥ Favorited':'♡ Favorite'}</button><button class="btn" onclick="imgM()">Change images</button></div>${rt?`<p style="margin-top:16px"><span class="stars">${stars(rt.rating,0)}</span> <b>${rt.rating}</b><small> / 10 · latest rating</small></p>`:''}</div></div>
<h2>Cast</h2><div class="cast">${m.cast.map(c=>`<div class="cm">${c.p?`<img loading="lazy" src="${IMG}w185${c.p}">`:'<div class="ph"></div>'}<div>${esc(c.n)}</div><small>${esc(c.ch||'')}</small></div>`).join('')||'<p class="mu">No cast listed.</p>'}</div>
<h2>Your logs</h2><div class="panel">${logs.map(l=>`<div class="lg"><div><b>${wd(l.date)}, ${l.date}</b><br><small>Week ${wk(l.date)}${l.min?' · '+l.min+' min':''}</small>${l.note?`<p>${esc(l.note)}</p>`:''}</div><span><span class="stars">${stars(l.rating,0)}</span> <b>${l.rating||'–'}</b></span><button class="btn" onclick="logM('${l.lid}')">Edit</button><button class="btn" onclick="delLog('${l.lid}')">Delete</button></div>`).join('')||'<p class="mu">Not logged yet. Hit “Log” to add your first entry.</p>'}</div></main>`}
function fav(){ens();const s=D.items[key()];s.fav=s.fav?0:1;save();dview()}
function delLog(id){if(!confirm('Delete this log?'))return;const s=D.items[key()];s.logs=s.logs.filter(l=>l.lid!=id);save();dview()}
function logM(id){const m=M,l=id?D.items[key()].logs.find(x=>x.lid==id):{date:today(),rating:0,note:'',min:m.type=='tv'?(m.rt*m.eps||m.rt):m.rt};ST=l.rating;LG=id||null;
modal(`<h2 style="margin-top:0">${id?'Edit log':'Log'}: ${esc(m.title)}</h2><label>Date watched</label><input type="date" id="ld" value="${l.date}" oninput="dl()"><p id="dd" style="margin-top:6px;font-weight:600"></p><label>Rating</label><div id="st"></div><label>Minutes watched</label><input type="number" id="lm" value="${l.min||0}"><label>Notes</label><textarea id="ln" rows="3">${esc(l.note)}</textarea><div class="acts"><button class="btn" onclick="modal()">Cancel</button><button class="btn p" onclick="saveLog()">Save</button></div>`);dl();rs()}
const dl=()=>{const d=$('#ld').value;$('#dd').textContent=d?`${wd(d)} · Week ${wk(d)}`:''};
const rs=()=>$('#st').innerHTML=`<div class="stars big">${stars(ST,1)}</div> <b>${ST?ST+' / 10':'Unrated'}</b> <small>(click a star's left or right half)</small>`;
function sc(e,n){const r=e.target.getBoundingClientRect(),v=e.clientX-r.left<r.width/2?n-.5:n;ST=ST==v?0:v;rs()}
function saveLog(){const d=$('#ld').value;if(!d)return toast('Pick a date');ens();const s=D.items[key()],o={lid:LG||Date.now().toString(36),date:d,rating:ST,min:+$('#lm').value||0,note:$('#ln').value.trim()};s.logs=LG?s.logs.map(x=>x.lid==LG?o:x):[...s.logs,o];save();modal();dview();toast('Saved')}
async function imgM(k){IT=k||IT;modal('<div class="ld">Loading images…</div>');if(!IM||IM.k!=key())try{IM={k:key(),...await api(`/${M.type}/${M.id}/images`,'include_image_language=en,null')}}catch(e){IM={k:key(),posters:[],backdrops:[]}}
const p=IT=='poster',L=(p?IM.posters:IM.backdrops).slice(0,40);
modal(`<h2 style="margin-top:0">Change images</h2><div class="tabs"><button class="${p?'on':''}" onclick="imgM('poster')">Posters</button><button class="${p?'':'on'}" onclick="imgM('backdrop')">Backdrops</button></div><div class="ig ${IT}">${L.map(i=>`<img loading="lazy" src="${IMG}${p?'w342':'w500'}${i.file_path}" onclick="setImg(IT,'${IMG}${p?'w500':'w1280'}${i.file_path}')">`).join('')||'<p class="mu">No images on TMDb.</p>'}</div><div class="or">Or use your own</div><div class="acts2"><input id="iu" placeholder="Paste an image link…"><button class="btn" onclick="setImg(IT,$('#iu').value.trim())">Use link</button><label class="btn" style="margin:0">Upload<input type="file" accept="image/*" hidden onchange="upl(IT,this.files[0])"></label></div><div class="acts"><button class="btn" onclick="modal()">Close</button></div>`)}
function setImg(k,u){if(!u)return;ens();D.items[key()][k]=u;save();modal();dview()}
function upl(k,f){if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const mx=k=='poster'?600:1280,s=Math.min(1,mx/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);setImg(k,c.toDataURL('image/jpeg',.82))};i.src=r.result};r.readAsDataURL(f)}
/* diary & favorites */
function diary(){const a=allLogs().filter(x=>DF=='all'||x.type==DF).sort((x,y)=>y.date.localeCompare(x.date)),g={};a.forEach(l=>(g[l.date.slice(0,7)]??=[]).push(l));
$('#app').innerHTML=`<main class="nar"><h1>Diary</h1><div class="tabs" style="margin-top:12px">${[['all','All'],['movie','Movies'],['tv','TV shows']].map(([k,n])=>`<button class="${DF==k?'on':''}" onclick="DF='${k}';diary()">${n}</button>`).join('')}</div>${Object.entries(g).map(([mo,ls])=>`<div class="mh">${new Date(mo+'-15T12:00Z').toLocaleDateString('en',{month:'long',year:'numeric'})}</div><div class="panel">${ls.map(l=>`<a class="lg" href="#/${l.type}/${l.id}"><img src="${esc(l.poster)}" width="40" style="border-radius:6px"><div><b>${esc(l.title)}</b> <small>${l.year}</small><br><small>${wd(l.date).slice(0,3)} ${l.date.slice(5)} · Week ${wk(l.date)}</small></div><span class="stars">${stars(l.rating,0)}</span>${l.fav?'<span style="color:#ff4d6d">♥</span>':''}</a>`).join('')}</div>`).join('')||'<p class="mu" style="margin-top:20px">Nothing logged yet. Search for a title to start.</p>'}</main>`}
function favs(){const a=Object.values(D.items).filter(i=>i.fav);$('#app').innerHTML=`<main><h1>Favorites</h1><br><div class="grid">${a.map(card).join('')||'<p class="mu">Tap ♡ on any title to add it here.</p>'}</div></main>`}
/* stats */
function stats(){const A=allLogs(),yrs=[...new Set(A.filter(l=>l.rating).map(l=>l.date.slice(0,4)))].sort();if(!yrs.includes(SS.yr))SS.yr=yrs[yrs.length-1];const Y=SS.sc=='y',
L=A.filter(l=>(SS.ty=='all'||l.type==SS.ty)&&(!Y||l.date.startsWith(SS.yr))),R=L.filter(l=>l.rating),n=L.length,sum=(a,f)=>a.reduce((s,x)=>s+f(x),0),uq=new Set(L.map(l=>l.type+l.id)).size,
cnt=f=>{const m=new Map;L.forEach(l=>f(l).forEach(k=>k&&m.set(k,(m.get(k)||0)+1)));return m},
hist=(a,l)=>{const m=Math.max(...a,1);return`<div class="hist">${a.map((v,i)=>`<div class="col" title="${l[i]}: ${v}"><i style="height:${v/m*100}%"></i><span>${l[i]}</span></div>`).join('')}</div>`},
rank=(m,k=8)=>{const a=[...m].sort((x,y)=>y[1]-x[1]).slice(0,k),mx=a[0]?.[1]||1;return a.map(([k,v])=>`<div class="rk"><span>${esc(k)}</span><u><i style="width:${v/mx*100}%"></i></u><b>${v}</b></div>`).join('')||'<p class="mu">No data yet</p>'},
pn=(t,b)=>`<div class="panel"><h3>${t}</h3>${b}</div>`,
ds=[...new Set(L.map(l=>l.date))].sort();let st=0,run=0,pv=null;for(const d of ds){run=pv&&new Date(d)-new Date(pv)==864e5?run+1:1;st=Math.max(st,run);pv=d}
const wdc=[1,2,3,4,5,6,0].map(d=>L.filter(l=>new Date(l.date+'T12:00Z').getUTCDay()==d).length),topd=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][wdc.indexOf(Math.max(...wdc))],
uniq=a=>{const s=new Set;return a.filter(l=>!s.has(l.type+l.id)&&s.add(l.type+l.id))},mini=a=>`<div class="grid mini">${a.map(l=>`<a href="#/${l.type}/${l.id}" title="${esc(l.title)}"><img src="${esc(l.poster)}"><span class="bdg">★ ${l.rating}</span></a>`).join('')||'<p class="mu">No ratings yet</p>'}</div>`,
top=uniq(R.slice().sort((a,b)=>b.rating-a.rating||b.date.localeCompare(a.date))).slice(0,6),low=uniq(R.slice().sort((a,b)=>a.rating-b.rating||b.date.localeCompare(a.date))).slice(0,6),
ys=L.map(l=>+l.date.slice(0,4)),y0=Math.min(...ys),y1=Math.max(...ys),yl=y1>=y0?[...Array(y1-y0+1)].map((_,i)=>y0+i):[],
T=[['Entries',n],['Titles',uq],['Hours watched',(sum(L,l=>l.min)/60).toFixed(1)],['Average rating',R.length?(sum(R,l=>l.rating)/R.length).toFixed(2):'–'],['Favorites',new Set(L.filter(l=>l.fav).map(l=>l.type+l.id)).size],['Days active',ds.length],['Longest streak',st+' day'+(st==1?'':'s')],['Avg length',n?Math.round(sum(L,l=>l.min)/n)+' min':'–'],['Rewatches',n-uq],['Busiest weekday',n?topd:'–'],['5★+ ratings',R.filter(l=>l.rating>=9).length],['Under 5',R.filter(l=>l.rating<5).length]];
if(SS.ty=='all')T.splice(2,0,['Movies',L.filter(l=>l.type=='movie').length],['TV shows',L.filter(l=>l.type=='tv').length]);
const bt=(k,v,t)=>`<button class="${SS[k]==v?'on':''}" onclick="SS.${k}='${v}';stats()">${t}</button>`;
$('#app').innerHTML=`<main><h1>Stats</h1><div style="margin-top:14px"><div class="tabs">${bt('sc','y','Yearly')}${bt('sc','t','Total')}</div><div class="tabs">${bt('ty','all','Combined')}${bt('ty','movie','Movies')}${bt('ty','tv','TV shows')}</div>${Y&&yrs.length?`<select onchange="SS.yr=this.value;stats()">${yrs.map(y=>`<option ${y==SS.yr?'selected':''}>${y}</option>`).join('')}</select>`:''}</div>${Y&&!yrs.length?'<p class="mu" style="margin-top:20px">Rate something to unlock yearly stats.</p>':`<div class="tiles">${T.map(([k,v])=>`<div class="tile"><b>${v}</b><span>${k}</span></div>`).join('')}</div><div class="g2">
${pn('Ratings',hist([...Array(20)].map((_,i)=>R.filter(l=>l.rating==(i+1)/2).length),[...Array(20)].map((_,i)=>i%2?(i+1)/2:'')))}
${pn(Y?'By month':'By year',Y?hist([...Array(12)].map((_,i)=>L.filter(l=>+l.date.slice(5,7)==i+1).length),[...'JFMAMJJASOND']):hist(yl.map(y=>ys.filter(v=>v==y).length),yl))}
${pn('By weekday',hist(wdc,['Mon','Tue','Wed','Thu','Fri','Sat','Sun']))}
${pn('Top genres',rank(cnt(l=>l.genres)))}${pn('Top directors',rank(cnt(l=>l.dir)))}${pn('Top actors',rank(cnt(l=>l.cast.slice(0,10).map(c=>c.n))))}
${pn('By decade released',rank(cnt(l=>[l.year&&Math.floor(l.year/10)*10+'s'])))}${pn('Content ratings',rank(cnt(l=>[l.cert])))}${pn('Busiest weeks',rank(cnt(l=>[l.date.slice(0,4)+' · Week '+wk(l.date)]),5))}
${pn('Highest rated',mini(top))}${pn('Lowest rated',mini(low))}</div>`}</main>`}
/* settings */
function settings(){$('#app').innerHTML=`<main class="nar"><h1>Settings</h1><br><div class="panel"><h3>TMDb API key</h3><p class="mu" style="margin-bottom:10px">Paste your TMDb v3 API key or read access token. It stays in this browser.</p><div class="acts2"><input id="ak" type="password" value="${esc(D.key)}"><button class="btn p" onclick="D.key=$('#ak').value.trim();save();toast('Key saved')">Save</button></div></div>
<div class="panel"><h3>Theme</h3><div class="sw">${Object.keys(TH).map(n=>`<button class="swb ${D.theme==n?'on':''}" onclick="setTh('${n}')"><span>${TH[n].map(c=>`<i style="background:${c}"></i>`).join('')}</span>${n}</button>`).join('')}</div><div class="mh">Custom theme${D.theme=='Custom'?' (active)':''}</div><div class="cp">${['Background','Surface','Text','Muted','Accent'].map((n,i)=>`<label>${n}<input type="color" value="${D.custom[i]}" oninput="cu(${i},this.value)"></label>`).join('')}</div></div>
<div class="panel"><h3>Your data</h3><p class="mu" style="margin-bottom:10px">Logs live in this browser. Export a backup to move them to another device.</p><div class="acts2"><button class="btn" onclick="exp()">Export JSON</button><label class="btn" style="margin:0">Import JSON<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label><button class="btn" onclick="out()">Sign out</button><button class="btn" onclick="delAcc()" style="color:#ff4d6d">Delete account</button></div></div></main>`}
const setTh=n=>{D.theme=n;save();applyTheme();settings()},cu=(i,v)=>{D.custom[i]=v;D.theme='Custom';save();applyTheme()};
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...D,key:''})],{type:'application/json'}));a.download=`filmstack-${U}.json`;a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.items)throw 0;D={...D,...j,key:D.key};save();applyTheme();toast('Imported');settings()}catch(e){toast('Not a valid FilmStack file')}};r.readAsText(f)}
function delAcc(){if(confirm('Delete this account and all its logs?')){const us=users();delete us[U];LS.fs_users=JSON.stringify(us);LS.removeItem('fs_d_'+U);out()}}
if(U&&users()[U]){load();boot()}else{U=null;route()}
</script></body></html>
