<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FilmStack</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f14;--sf:#171a22;--tx:#eef0f5;--mu:#8b93a7;--ac:#7c5cff;--ax:#fff;--gd:#f5c518;--ln:color-mix(in srgb,var(--tx) 12%,transparent)}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}.mu,small{color:var(--mu)}
header{position:sticky;top:0;z-index:20;display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:12px 24px;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.logo{font-weight:800;font-size:22px;letter-spacing:-1px}.logo b{color:var(--ac)}
nav{display:flex;gap:4px;flex:1}nav a{padding:6px 12px;border-radius:99px;color:var(--mu);font-weight:500}nav a.on,nav a:hover{color:var(--tx);background:var(--ln)}
input,select,textarea{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:9px 12px;outline:0;max-width:100%}input:focus,textarea:focus,select:focus{border-color:var(--ac)}
.btn,.tabs button{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-block}.btn:hover{border-color:var(--ac)}.btn.p,.tabs .on{background:var(--ac);color:var(--ax);border-color:var(--ac)}
.tabs{display:inline-flex;gap:6px;margin:6px 8px 6px 0}.tabs button{padding:6px 14px;border-radius:99px}
#app{position:relative;z-index:0;min-height:80vh}main{max-width:1180px;margin:0 auto;padding:24px}.nar{max-width:760px}
.bd{position:absolute;inset:0 0 auto;height:480px;background-size:cover;background-position:center 20%;opacity:.5;z-index:-1;-webkit-mask:linear-gradient(#000 30%,transparent);mask:linear-gradient(#000 30%,transparent)}
h1{font-size:34px;letter-spacing:-1px;line-height:1.15}h2{font-size:18px;margin:28px 0 12px}h3{margin-bottom:10px}
.row{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.card{position:relative;flex:0 0 150px;min-width:0}.card img,.ph{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:12px;background:var(--sf);display:block;transition:transform .2s}.card:hover img{transform:translateY(-4px)}
.ct{font-weight:600;font-size:14px;margin-top:6px;line-height:1.3}.hb{position:absolute;top:8px;right:8px;background:#000a;color:#ff4d6d;border-radius:99px;padding:0 7px}
.dp{display:flex;gap:28px;padding-top:70px}.pst{width:240px;height:360px;object-fit:cover;border-radius:14px;box-shadow:0 20px 50px #0008;background:var(--sf)}
.chip{display:inline-block;border:1px solid var(--ln);border-radius:99px;padding:2px 12px;margin:0 6px 6px 0;font-size:13px}
.stars{display:inline-flex}.stars i{font-style:normal;font-size:20px;background:linear-gradient(90deg,var(--gd) var(--f),color-mix(in srgb,var(--tx) 20%,transparent) var(--f));-webkit-background-clip:text;background-clip:text;color:transparent}.big i{font-size:29px;cursor:pointer}
.cast{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}.cm{flex:0 0 112px;text-align:center}.cm img,.cm .ph{width:112px;height:112px;border-radius:50%;object-fit:cover;aspect-ratio:1;background:var(--sf)}.cm div{font-size:13px;font-weight:600;margin-top:6px}.cm small{font-size:12px;display:block}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:18px;margin-bottom:16px}.lg{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--ln)}.lg:last-child{border:0}.lg>div{flex:1;min-width:160px}
.ov{position:fixed;inset:0;background:#000a;z-index:50;display:grid;place-items:center;padding:16px}.mb{background:var(--bg);border:1px solid var(--ln);border-radius:18px;padding:22px;width:560px;max-width:100%;max-height:90vh;overflow:auto}
.mb label{display:block;margin:12px 0 4px;color:var(--mu);font-size:13px}.mb input:not([type=file]),.mb textarea{width:100%}.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.acts2{display:flex;gap:8px;flex-wrap:wrap}.acts2 input{flex:1;min-width:140px}
.ig{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin:12px 0}.ig.backdrop{grid-template-columns:repeat(auto-fill,minmax(180px,1fr))}.ig img{width:100%;border-radius:8px;cursor:pointer;border:2px solid transparent}.ig img:hover{border-color:var(--ac)}.or{text-align:center;color:var(--mu);margin:10px}
.auth{max-width:380px;margin:12vh auto;padding:0 20px;text-align:center}.auth form{display:grid;gap:10px;margin-top:16px}.auth .logo{font-size:44px;display:block}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ac);color:var(--ax);padding:10px 18px;border-radius:99px;z-index:99;font-weight:600}
.ld,.err{padding:60px 24px;text-align:center;color:var(--mu)}.err{color:var(--tx)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:16px 0}.tile{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px}.tile b{font-size:26px;display:block;letter-spacing:-.5px}.tile span{color:var(--mu);font-size:13px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}.g2 .panel{margin:0}.hist{display:flex;align-items:flex-end;gap:3px;height:150px}.col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;color:var(--mu)}.col i{width:100%;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px}.col span{height:16px;margin-top:4px}
.rk{display:grid;grid-template-columns:minmax(80px,1.2fr) 2fr 28px;gap:10px;align-items:center;margin:6px 0;font-size:14px}.rk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rk u{height:8px;background:var(--ln);border-radius:9px;overflow:hidden}.rk u i{display:block;height:100%;background:var(--ac)}.rk b{text-align:right}
.mini{grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}.mini a{position:relative}.mini img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:8px}.bdg{position:absolute;bottom:4px;left:4px;background:#000b;color:var(--gd);font-size:11px;padding:0 6px;border-radius:99px}
.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}.swb{background:var(--sf);border:2px solid var(--ln);border-radius:12px;padding:8px;cursor:pointer;text-align:left}.swb.on{border-color:var(--ac)}.swb span{display:flex;height:18px;border-radius:6px;overflow:hidden;margin-bottom:6px}.swb i{flex:1}
.cp{display:flex;gap:14px;flex-wrap:wrap}.cp label{display:grid;gap:4px;color:var(--mu);font-size:13px}.cp input{height:40px;width:80px;padding:2px}
.mh{font-size:13px;font-weight:700;margin:22px 0 6px;color:var(--mu)}
.bio{display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;white-space:pre-line;max-width:70ch}.bio.x{display:block}
.more{flex:0 0 150px;aspect-ratio:2/3;display:grid;place-items:center;text-align:center;border:1px dashed var(--ln);border-radius:12px;cursor:pointer;color:var(--mu);font-weight:600}.more:hover{border-color:var(--ac);color:var(--tx)}
.facts{display:flex;gap:24px;flex-wrap:wrap;margin:0 0 16px;font-size:14px;max-width:62ch}
.ban{position:relative;aspect-ratio:2/1;max-height:480px;border-radius:16px;background-color:var(--sf);background-position:center;background-size:cover}.dots{position:absolute;top:12px;right:12px;background:#000a;color:#fff;border:0;border-radius:99px;font-size:20px;line-height:1;padding:6px 14px;cursor:pointer}
.pf{display:grid;grid-template-columns:minmax(0,648px) minmax(300px,1fr);gap:28px;margin-top:8px}.pf>div>h2:first-child{margin-top:0}.pf aside .panel{margin-bottom:14px}.pf aside .rk{margin:4px 0}.pf aside>.btn{display:block;width:100%;text-align:center;margin-bottom:14px}.pf aside .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}.pf aside .tile{padding:12px;background:var(--bg)}.pf aside .tile b{font-size:22px;line-height:1.4}.pf aside .tile:last-child:nth-child(odd){grid-column:1/-1}.tl{font-size:14px;font-weight:700;line-height:1.45}.tl ul{padding-left:16px}.pf aside .rl{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px}.pf aside .rl .ct{font-size:12px}.pf aside .rl small{font-size:11px}.mn{display:grid;gap:8px}.mn .btn{text-align:center}
.lc{position:relative}.row .lc{flex:0 0 150px}.rn{position:absolute;top:6px;left:6px;background:var(--ac);color:var(--ax);font-weight:800;min-width:26px;height:26px;display:grid;place-items:center;border-radius:99px;padding:0 6px}
.strip{display:flex;padding-right:6px}.strip img{width:20%;aspect-ratio:2/3;object-fit:cover;border-radius:6px;margin-right:-6px;box-shadow:2px 0 8px #0008}
.av img,.av span{width:36px;height:36px;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--ac);color:var(--ax);font-weight:800}
.card{display:block}.dots{top:14px;right:20px;z-index:2}.bd.pb{height:620px;opacity:.65;background-position:center;-webkit-mask:linear-gradient(#000 55%,transparent);mask:linear-gradient(#000 55%,transparent)}
@media(max-width:900px){.pf{grid-template-columns:1fr}}
@media(max-width:700px){header{padding:10px 14px}.dp{flex-direction:column;align-items:center;padding-top:40px}.pst{width:200px;height:300px}main{padding:16px}.big i{font-size:24px}}
</style></head><body>
<header><a class="logo" href="#/">film<b>stack</b></a><nav><a href="#/">Home</a><a href="#/diary">Diary</a><a href="#/favs">Favorites</a><a href="#/stats">Stats</a><a href="#/watchlist">Watchlist</a><a href="#/lists">Lists</a></nav><form onsubmit="return srch()"><input id="q" oninput="deb(srch)" placeholder="Search…"></form><a class="av" href="#/profile" id="ub"></a></header>
<div id="app"></div><div id="md"></div>
<script>
const $=s=>document.querySelector(s),LS=localStorage,IMG='https://image.tmdb.org/t/p/',W=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TH={Midnight:['#0d0f14','#171a22','#eef0f5','#8b93a7','#7c5cff'],Letterboxd:['#14181c','#202830','#e4ecf3','#8899aa','#00e054'],Noir:['#000000','#121212','#ffffff','#888888','#e50914'],Sunset:['#1a0f1f','#2a1630','#ffeede','#b99aa8','#ff7a45'],Ocean:['#08141f','#0f2433','#e6f4ff','#7fa3bd','#2ec4ff'],Forest:['#0e1511','#17221b','#e8f3ea','#86a08d','#5fd38d'],Rose:['#1c1117','#2a1a22','#fdeef3','#b896a4','#ff5c8a'],Dracula:['#282a36','#343746','#f8f8f2','#9aa0c0','#bd93f9'],Nord:['#2e3440','#3b4252','#eceff4','#9aa5b8','#88c0d0'],Gold:['#121008','#1d1a0e','#f7f1dc','#a39b78','#f5c518'],Paper:['#f5f2ec','#ffffff','#1c1b1a','#6f6a60','#d9480f'],Light:['#f4f6fb','#ffffff','#12151c','#667085','#5b45ef']};
let U=LS.fs_session||null,D=null,M=null,mode='in',ST=0,LG=null,IT='poster',IM=null,DF='all',SS={sc:'y',ty:'all',yr:null};
const users=()=>JSON.parse(LS.fs_users||'{}'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),key=()=>M.type+':'+M.id;
const load=()=>{D=JSON.parse(LS['fs_d_'+U]||'null')||{key:'',theme:'Midnight',custom:[...TH.Midnight],items:{}};D.profile??={top:{}};D.people??={};D.lists??=[];D.lists.forEach(l=>l.kind??='content');D.profile.top.actor??=D.profile.top.person};
const save=()=>{try{LS['fs_d_'+U]=JSON.stringify(D)}catch(e){toast('Storage full: remove uploaded images or export your data')}};
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2800)};
const modal=h=>{$('#md').innerHTML=h?`<div class="ov" onclick="if(event.target==this)modal()"><div class="mb">${h}</div></div>`:''};
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const wk=d=>{const t=new Date(d+'T12:00Z'),n=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-n+3);const f=new Date(Date.UTC(t.getUTCFullYear(),0,4));return 1+Math.round(((t-f)/864e5-3+(f.getUTCDay()+6)%7)/7)};
const wd=d=>W[new Date(d+'T12:00Z').getUTCDay()];
function applyTheme(){const t=D?(D.theme=='Custom'?D.custom:TH[D.theme]||TH.Midnight):TH.Midnight,r=document.documentElement.style;['bg','sf','tx','mu','ac'].forEach((k,i)=>r.setProperty('--'+k,t[i]));const[R,G,B]=[1,3,5].map(i=>parseInt(t[4].substr(i,2),16));r.setProperty('--ax',R*.299+G*.587+B*.114>150?'#000':'#fff')}
async function hash(p,s){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']),b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(s),iterations:150000,hash:'SHA-256'},k,256);return btoa(String.fromCharCode(...new Uint8Array(b)))}
async function api(p,q=''){if(!D.key)throw Error('Add your TMDb API key in Settings to load movies and shows.');const bear=D.key.length>40,r=await fetch('https://api.themoviedb.org/3'+p+'?'+(bear?'':'api_key='+D.key+'&')+q,bear?{headers:{Authorization:'Bearer '+D.key}}:{});if(!r.ok)throw Error(r.status==401?'TMDb rejected your API key. Check it in Settings.':'TMDb error '+r.status);return r.json()}
/* auth */
function authView(){$('header').style.display='none';$('#app').innerHTML=`<div class="auth"><a class="logo">film<b>stack</b></a><p class="mu">Log every film and show you watch.</p><div class="tabs"><button class="${mode=='in'?'on':''}" onclick="mode='in';authView()">Sign in</button><button class="${mode=='up'?'on':''}" onclick="mode='up';authView()">Create account</button></div><form onsubmit="auth(event)"><input id="u" placeholder="Username" autocomplete="username"><input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="${mode=='in'?'current':'new'}-password"><button class="btn p">${mode=='in'?'Sign in':'Create account'}</button></form><p class="mu" style="margin-top:16px;font-size:13px">Accounts live only in this browser. Passwords are salted and hashed; nothing is sent anywhere.</p></div>`}
async function auth(e){e.preventDefault();const u=$('#u').value.trim().toLowerCase(),p=$('#pw').value,us=users();if(u.length<2||p.length<6)return toast('Username 2+ characters, password 6+');
if(mode=='up'){if(us[u])return toast('That username is taken');const s=crypto.randomUUID();us[u]={s,h:await hash(p,s)};LS.fs_users=JSON.stringify(us)}else if(!us[u]||us[u].h!=await hash(p,us[u].s))return toast('Wrong username or password');
U=u;LS.fs_session=u;load();boot()}
const boot=()=>{applyTheme();$('header').style.display='';hdr();route()};
const out=()=>{LS.removeItem('fs_session');U=D=null;applyTheme();route()};
/* helpers */
const stars=(r,i)=>[...Array(10)].map((_,j)=>`<i ${i?`onclick="sc(event,${j+1})"`:''} style="--f:${r>=j+1?100:r>=j+.5?50:0}%">★</i>`).join('');
const norm=(r,t)=>({id:r.id,type:t||r.media_type,title:r.title||r.name,year:(r.release_date||r.first_air_date||'').slice(0,4),poster:r.poster_path||r.profile_path});
const card=it=>{const s=D.items[it.type+':'+it.id],u=s?.poster||(it.poster?(it.poster[0]=='/'?IMG+'w342'+it.poster:it.poster):'');return`<a class="card" href="#/${it.type}/${it.id}">${u?`<img loading="lazy" src="${esc(u)}">`:'<div class="ph"></div>'}${s?.fav?'<span class="hb">♥</span>':''}<div class="ct">${esc(it.title)}</div><small>${it.year||''}${s?.logs?.length?' · ✓ logged':''}</small></a>`};
const allLogs=()=>{const a=[];for(const it of Object.values(D.items))for(const l of it.logs||[])a.push({...it,...l});return a};
/* routing */
async function route(){if(!U)return authView();const[,p='',a]=location.hash.split('/');if(p!='search')$('#q').value='';document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',x.getAttribute('href')=='#/'+p));LE=FE=0;$('#app').innerHTML='<div class="ld">Loading…</div>';scrollTo(0,0);
try{if(p=='movie'||p=='tv'){M=await detail(p,a);dview()}else if(p=='search')await search(decodeURIComponent(a||''));else if(p=='person')await person(a);else if(p=='profile')profile();else if(p=='lists')lists();else if(p=='list')listView(a);else if(p=='watchlist')watchlist();else if(p=='studio')await studio(a);else if(p=='diary')diary();else if(p=='favs')favs();else if(p=='stats')stats();else if(p=='settings')settings();else await home()}
catch(e){$('#app').innerHTML=`<main><div class="err">${esc(e.message)}<br><br>${D.key?'':'<a class="btn p" href="#/settings">Open settings</a>'}</div></main>`}}
addEventListener('hashchange',route);
let sT;const deb=f=>{clearTimeout(sT);sT=setTimeout(f,300)},srch=()=>{const v=$('#q').value.trim();if(v){const h='#/search/'+encodeURIComponent(v);location.hash.startsWith('#/search')?location.replace(h):location.hash=h}return false};
/* home & search */
async function home(){mp=4;const[m,m2,m3,t]=await Promise.all([1,2,3].map(p=>api('/trending/movie/'+TW,'page='+p)).concat(api('/trending/tv/'+TW))),f=m.results[0],rec=Object.values(D.items).filter(i=>i.logs?.length).sort((a,b)=>b.logs.map(l=>l.date).sort().pop().localeCompare(a.logs.map(l=>l.date).sort().pop())).slice(0,12);
$('#app').innerHTML=`<div class="bd" style="background-image:url(${IMG}w1280${f.backdrop_path})"></div><main><div style="padding:50px 0 10px"><h1>Trending ${TW=='day'?'today':'this week'}</h1><div class="tabs" style="margin:10px 0"><button class="${TW=='day'?'on':''}" onclick="TW='day';route()">Today</button><button class="${TW=='week'?'on':''}" onclick="TW='week';route()">This week</button></div><p class="mu">Welcome back, ${esc(U)}. Find something to log.</p></div>${rec.length?`<h2>Recently logged</h2><div class="row">${rec.map(card).join('')}</div>`:''}<h2>Trending movies</h2>${[m,m2,m3].map(mr).join('')}<h2>Trending TV shows</h2><div class="row">${t.results.map(r=>card(norm(r,'tv'))).join('')}</div></main>`}
let mp=4,TW='week';
const mr=r=>`<div class="row">${r.results.map(x=>card(norm(x,'movie'))).join('')}<div class="more" onclick="more(this)">+<br>See more</div></div>`;
async function more(el){el.textContent='Loading…';try{const r=await api('/trending/movie/'+TW,'page='+mp++);el.insertAdjacentHTML('beforebegin',r.results.map(x=>card(norm(x,'movie'))).join(''))}catch(e){toast(e.message)}el.innerHTML='+<br>See more'}
async function search(q){const r=(await api('/search/multi','query='+encodeURIComponent(q))).results.map(x=>{const n=norm(x);return x.media_type=='person'?{...n,year:x.known_for_department||'',poster:D.people[n.id]?.photo||n.poster}:n});$('#app').innerHTML=`<main><h1>Results for “${esc(q)}”</h1><br><div class="grid">${r.map(card).join('')||'<p class="mu">Nothing found.</p>'}</div></main>`}
/* detail */
async function detail(type,id){const m=type=='movie',d=await api(`/${type}/${id}`,'append_to_response=credits,external_ids,'+(m?'release_dates':'content_ratings'));let cert='';
try{cert=m?d.release_dates.results.find(x=>x.iso_3166_1=='US').release_dates.find(x=>x.certification).certification:d.content_ratings.results.find(x=>x.iso_3166_1=='US').rating}catch(e){}
const J=['Director','Screenplay','Writer','Producer','Original Music Composer','Director of Photography','Editor'],cm={},dr=m?d.credits.crew.filter(c=>c.job=='Director'):(d.created_by||[]);d.credits.crew.filter(c=>J.includes(c.job)).forEach(c=>(cm[c.id]??={n:c.name,id:c.id,p:c.profile_path,j:[]}).j.push(c.job));

const A=allLogs(),R=A.filter(l=>l.rating),nm=A.filter(l=>l.type=='movie').length,td=today(),rec=[...A].sort((a,b)=>b.date.localeCompare(a.date)),WL=Object.values(D.items).filter(i=>i.wl),

sl=t=>{const a=P.top[t]||[];if(!FE&&!a.length)return'';return`<h2>Favorite ${{movie:'films',tv:'shows',actor:'actors',director:'directors'}[t]}</h2><div class="grid" style="grid-template-columns:repeat(4,minmax(0,150px))">${[0,1,2,3].map(i=>a[i]?`<div><a class="card" href="#/${a[i].type}/${a[i].id}"><img src="${esc(fp(a[i]))}"></a><div class="ct" style="font-size:13px">${esc(a[i].title)}</div>${FE?`<button class="btn" style="width:100%;margin-top:4px;padding:3px" onclick="topM('${t}',${i})">Change</button>`:''}</div>`:FE?`<div class="more" onclick="topM('${t}',${i})">+<br>Add</div>`:'').join('')}</div>`},
gl=`<div class="panel"><h3>At a glance</h3><div class="tiles">${T.map(([k,v])=>`<div class="tile">${String(v).startsWith('<ul')?`<div class="tl">${v}</div>`:`<b>${v}</b>`}<span>${k}</span></div>`).join('')}</div></div>`,

$('#app').innerHTML=`<div class="bd pb" style="background-image:url(${esc(P.banner||'')})"></div><button class="dots" onclick="menu()" title="Edit profile">⋯</button><main style="padding-top:250px"><div class="acts2" style="align-items:flex-end">${P.avatar?`<img src="${esc(P.avatar)}" style="width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid var(--bg)">`:`<div class="pst" style="width:110px;height:110px;border-radius:50%;display:grid;place-items:center;font-size:44px;font-weight:800;border:4px solid var(--bg)">${esc(U[0].toUpperCase())}</div>`}<div style="flex:1;min-width:200px"><h1>${esc(P.name||U)}</h1><p class="mu">@${esc(U)}${P.loc?' · '+esc(P.loc):''}${P.fg?' · Loves '+esc(P.fg):''}</p></div></div>${P.bio?`<p style="max-width:62ch;margin-top:16px;white-space:pre-line">${esc(P.bio)}</p>`:''}${P.link?`<p style="margin-top:6px"><a href="${esc(P.link)}" target="_blank" rel="noopener" style="color:var(--ac)">${esc(P.link)}</a></p>`:''}${P.quote?`<blockquote style="margin:16px 0;padding-left:14px;border-left:3px solid var(--ac);font-style:italic">${esc(P.quote)}</blockquote>`:''}
<div class="pf"><div>${FE?`<div class="panel" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span>Editing favorites</span><button class="btn p" onclick="FE=0;profile()">Done</button></div>`:''}${sl('movie')}${sl('tv')}${sl('actor')}${sl('director')}${FE||['movie','tv','actor','director'].some(t=>(P.top[t]||[]).length)?'':'<h2>Favorites</h2><p class="mu">Nothing here yet. <a onclick="FE=1;profile()" style="color:var(--ac);cursor:pointer">Edit favorites</a> to pick your top films, shows, actors and directors.</p>'}</div><aside>${side}</aside></div>${rl}</main>`}

let LI=null,AL=null,AR=[],LE=0,FE=0,LK='content';
const lcount=l=>{const n=l.items.length;return n+' '+(l.kind=='people'?(n==1?'person':'people'):'title'+(n==1?'':'s'))};
function lists(){const P=LK=='people',a=D.lists.filter(l=>(l.kind||'content')==LK).sort((x,y)=>y.upd-x.upd);$('#app').innerHTML=`<main><div class="acts2" style="align-items:center"><h1 style="flex:1">Lists</h1><button class="btn p" onclick="listM()">+ New list</button></div><div class="tabs" style="margin-top:12px">${[['content','Content'],['people','People']].map(([k,n])=>`<button class="${LK==k?'on':''}" onclick="LK='${k}';lists()">${n}</button>`).join('')}</div><div class="g2" style="margin-top:12px">${a.map(l=>`<a class="panel" href="#/list/${l.id}" style="display:block"><div class="strip">${l.items.slice(0,5).map(i=>`<img src="${esc(fp(i))}">`).join('')||'<div class="ph" style="height:90px;width:100%"></div>'}</div><h3 style="margin:12px 0 0">${esc(l.name)}</h3><small>${l.ranked?'Ranked · ':''}${lcount(l)}${l.pin?' · Pinned':''}</small></a>`).join('')||`<p class="mu">${P?'No people lists yet. Collect your favorite directors, actors or crews.':'No lists yet. Make a ranked top ten or a themed list.'}</p>`}</div></main>`}
function listM(id){const l=id?LF(id):{name:'',desc:'',ranked:0,kind:LK},k=l.kind||'content';LI=id||null;modal(`<h2 style="margin-top:0">${id?'Edit list':'New list'}</h2><label>Type</label>${id?`<p class="mu">${k=='people'?'People list (actors, directors…)':'Content list (movies & TV shows)'}</p>`:`<select id="lk_" style="width:100%"><option value="content" ${k=='content'?'selected':''}>Content (movies & TV shows)</option><option value="people" ${k=='people'?'selected':''}>People (actors, directors…)</option></select>`}<label>Name</label><input id="ln_" value="${esc(l.name)}"><label>Description</label><textarea id="ld_" rows="3">${esc(l.desc)}</textarea><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="lr_" ${l.ranked?'checked':''} style="width:auto"> Ranked list (numbered)</label><div class="acts"><button class="btn" onclick="modal()">Cancel</button><button class="btn p" onclick="saveL()">Save</button></div>`)}
function saveL(){const n=$('#ln_').value.trim();if(!n)return toast('Give the list a name');const f={name:n,desc:$('#ld_').value.trim(),ranked:$('#lr_').checked?1:0,upd:Date.now()};if(LI)Object.assign(LF(LI),f);else{const k=$('#lk_').value;LK=k;LI=newId();D.lists.push({id:LI,pin:0,items:[],kind:k,...f})}save();modal();const h='#/list/'+LI;location.hash==h?listView(LI):location.hash=h}
function listView(id){const l=LF(id);if(!l)throw Error('List not found');const P=l.kind=='people';LK=P?'people':'content';const b=(f,t,c='')=>`<button class="btn ${c}" onclick="${f}">${t}</button>`,sm='style="padding:2px 10px"';
$('#app').innerHTML=`<main><div class="acts2" style="align-items:center"><div style="flex:1;min-width:200px"><h1>${esc(l.name)}</h1><p class="mu">${P?'People list · ':'Content list · '}${l.ranked?'Ranked · ':''}${lcount(l)}</p></div>${LE?b(`addLM('${id}')`,P?'+ Add people':'+ Add titles','p')+b(`listM('${id}')`,'Edit details')+b(`delL('${id}')`,'Delete')+b(`LE=0;listView('${id}')`,'Done'):b(`LF('${id}').pin^=1;save();listView('${id}')`,l.pin?'Unpin from profile':'Pin to profile')+b(`LE=1;listView('${id}')`,'Edit entries')}</div>${l.desc?`<p style="max-width:70ch;margin-top:10px;white-space:pre-line">${esc(l.desc)}</p>`:''}<div class="grid" style="margin-top:20px">${l.items.map((x,i)=>`<div>${lc(P?{...x,poster:fp(x)}:x,i,l.ranked)}${LE?`<div class="acts2" style="margin-top:4px">${l.ranked?`<button class="btn" ${sm} onclick="mvL('${id}',${i},-1)">←</button><button class="btn" ${sm} onclick="mvL('${id}',${i},1)">→</button>`:''}<button class="btn" ${sm} onclick="rmL('${id}',${i})">Remove</button></div>`:''}</div>`).join('')||'<p class="mu">Empty so far.'+(LE?'':' Tap Edit entries to add '+(P?'people':'titles')+'.')+'</p>'}</div></main>`}
function mvL(id,i,d){const l=LF(id),a=l.items,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];l.upd=Date.now();save();listView(id)}

async function addS(){const q=$('#as').value.trim();if(!q)return;try{if(LF(AL).kind=='people')AR=(await api('/search/person','query='+encodeURIComponent(q))).results.filter(x=>x.profile_path).slice(0,18).map(x=>({id:x.id,type:'person',title:x.name,year:x.known_for_department||'',poster:IMG+'w500'+x.profile_path}));else AR=(await api('/search/multi','query='+encodeURIComponent(q))).results.filter(x=>x.media_type!='person'&&x.poster_path).slice(0,18).map(x=>({...norm(x),poster:IMG+'w500'+x.poster_path}));$('#ar').innerHTML=AR.map((x,j)=>`<img src="${esc(x.poster.replace('w500','w185'))}" title="${esc(x.title)}${x.year?' ('+x.year+')':''}" onclick="addPick(${j})">`).join('')}catch(e){toast(e.message)}}

const j=l.items.findIndex(i=>i.id==X.id&&i.type==X.type);j>=0?l.items.splice(j,1):l.items.push(P?{id:X.id,type:'person',title:X.title,year:X.year,poster:X.poster}:{id:M.id,type:M.type,title:M.title,year:M.year,poster:D.items[key()]?.poster||M.poster});l.upd=Date.now();save();tlM(k)}
