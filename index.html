  for(const i of Object.values(D.items)){if(i.wl&&i.date===undefined&&!D.tsubs[i.type+':'+i.id]){try{const d=await api(`/${i.type}/${i.id}`),dt=d.release_date||d.first_air_date||'';i.date=dt;i.status=d.status||'';ch=1;if(dt?dt>t:!UNR.includes(d.status))D.tsubs[i.type+':'+i.id]={type:i.type,id:i.id,title:i.title,year:i.year,date:dt,poster:i.poster}}catch(e){}}}
  for(const id of ids){const s=D.subs[id];if(!s)continue;try{const m=await credKeys(id),kn=new Set(s.known);s.up??={};
    m.forEach((v,k)=>{const nw=!kn.has(k);kn.add(k);if(nw&&(!v.date||v.date>=cut))add.push(mkN('new',id,s,v));if(v.date>t)s.up[k]=v});
    Object.keys(s.up).forEach(k=>{const v=m.get(k);if(!v||!v.date){delete s.up[k];return}if(v.date<=t){delete s.up[k];if(v.date>=cut)add.push(mkN('out',id,s,v))}else s.up[k]=v});
    s.known=[...kn]}catch(e){}}
  for(const k of Object.keys(D.tsubs)){const v=D.tsubs[k];try{const d=await api(`/${v.type}/${v.id}`),dt=d.release_date||d.first_air_date||'';if(dt!=v.date){v.date=dt;v.year=dt.slice(0,4)||v.year;ch=1}
    if(dt&&dt<=t){add.push({nid:newId(),ts:Date.now(),read:0,kind:'out',pid:null,pn:'Your watchlist',type:v.type,mid:v.id,title:v.title,year:v.year,date:dt,poster:v.poster});delete D.tsubs[k]}}catch(e){}}
  LS[lk]=Date.now();
  if(add.length)D.notifs=[...add,...D.notifs].slice(0,150);
  if(add.length||ch){save();bellUpd()}
  if(add.length&&D.nt.alert&&'Notification'in window&&Notification.permission=='granted')add.slice(0,3).forEach(a=>{try{new Notification(a.pn+(a.kind=='out'?' — now out':' — new project'),{body:a.title+(a.year?' ('+a.year+')':''),icon:a.poster||undefined})}catch(e){}})}
function ntM(){const N=D.notifs,S=Object.entries(D.subs),T=Object.entries(D.tsubs),up=[...S.flatMap(([id,s])=>Object.values(s.up||{}).map(v=>({...v,pn:s.name}))),...Object.values(D.tsubs).filter(v=>v.date).map(v=>({...v,pn:'Watchlist'}))].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,30),row=(n,sub)=>`<a class="nt ${n.read?'':'un'}" href="#/${n.type}/${n.mid||n.id}" onclick="ntOpen('${n.nid||''}')">${n.poster?`<img src="${esc(n.poster)}">`:''}<div><b>${esc(n.title)}</b> <small>${n.year||''}</small><br><small>${sub}</small></div></a>`;
  modal(`<h2 style="margin-top:0">Notifications</h2><div class="acts2"><button class="btn" onclick="ntChk()">Check now</button><button class="btn" onclick="ntRead()">Mark all read</button><button class="btn" onclick="ntClear()">Clear</button></div>${N.slice(0,40).map(n=>row(n,(n.kind=='out'?'Now out':'New project')+' · '+esc(n.pn)+(n.date?' · '+n.date:''))).join('')||'<p class="mu" style="margin-top:14px">Nothing yet. Follow an actor or director from their page and new projects will show up here.</p>'}
  <h3 style="margin-top:22px">Upcoming releases</h3>${up.map(v=>row(v,esc(v.pn)+' · '+v.date)).join('')||'<p class="mu">Nothing dated yet.</p>'}
  <h3 style="margin-top:22px">Following people (${S.length})</h3>${S.map(([id,s])=>`<div class="lg"><div><a href="#/person/${id}" onclick="modal()"><b>${esc(s.name)}</b></a> <small>${esc(s.dept||'')}</small></div><button class="btn" onclick="unf('${id}')">Unfollow</button></div>`).join('')||'<p class="mu">Nobody yet.</p>'}
  <h3 style="margin-top:22px">Watchlist titles awaiting release (${T.length})</h3>${T.map(([k,v])=>`<div class="lg"><div><a href="#/${v.type}/${v.id}" onclick="modal()"><b>${esc(v.title)}</b></a> <small>${v.date||'No date yet'}</small></div><button class="btn" onclick="unfT('${k}')">Unfollow</button></div>`).join('')||'<p class="mu">Add an unreleased title to your watchlist and it will show up here.</p>'}
  <label style="display:flex;gap:8px;align-items:center;margin-top:16px"><input type="checkbox" style="width:auto" ${D.nt.alert?'checked':''} onchange="ntAlert(this.checked)"> Also show browser alerts</label><p class="mu" style="font-size:12px;margin-top:4px">FilmStack checks for new projects when you open it (every few hours) or when you tap Check now.</p><div class="acts"><button class="btn" onclick="modal()">Close</button></div>`)}
const ntOpen=id=>{const n=D.notifs.find(x=>x.nid==id);if(n&&!n.read){n.read=1;save();bellUpd()}modal()},ntRead=()=>{D.notifs.forEach(n=>n.read=1);save();bellUpd();ntM()},ntClear=()=>{D.notifs=[];save();bellUpd();ntM()},unf=id=>{delete D.subs[id];save();ntM();folU()};
const unfT=k=>{delete D.tsubs[k];save();ntM()};
async function ntChk(){toast('Checking…');await ntCheck(1);ntM()}
async function ntAlert(on){if(on&&'Notification'in window){const p=await Notification.requestPermission();D.nt.alert=p=='granted'?1:0;if(!D.nt.alert)toast('Browser alerts are blocked for this site')}else D.nt.alert=0;save();ntM()}
/* csv import */
let CSVR=[],CSVX={stop:0},CSVB=[];
const csvH={title:['name','title','film','film name','film title','movie','movie name'],year:['year','release year','released','release date'],dir:['director','directors'],rating:['rating','your rating','stars','score'],date:['watched date','date watched','watched on','watched','date','date logged'],note:['review','notes','note','comment','comments'],rw:['rewatch','rewatched'],type:['type','media type','kind']};
function csvParse(t){t=t.replace(/^﻿/,'');const l1=t.split('\n')[0],dl=(l1.match(/;/g)||[]).length>(l1.match(/,/g)||[]).length?';':',',rows=[];let r=[],c='',q=0;
  for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=ch}else if(ch=='"')q=1;else if(ch==dl){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';rows.push(r);r=[]}else c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}return rows.filter(x=>x.some(v=>v.trim()))}
const p2=n=>String(n).padStart(2,'0');
function csvDate(v){v=(v||'').trim();if(!v)return'';let m=v.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/),y,a,b;
  if(m){y=m[1];a=+m[2];b=+m[3]}
  else if(m=v.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/)){y=m[3].length==2?'20'+m[3]:m[3];a=+m[1];b=+m[2];if(a>12){const z=a;a=b;b=z}}
  else{const d=new Date(v);return isNaN(d)?'':d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
  return a>=1&&a<=12&&b>=1&&b<=31?y+'-'+p2(a)+'-'+p2(b):''}
function csvRows(text){const rows=csvParse(text);if(rows.length<2)return null;const hd=rows[0].map(h=>h.trim().toLowerCase()),col={};
  for(const k of Object.keys(csvH)){for(const n of csvH[k]){const i=hd.indexOf(n);if(i>=0){col[k]=i;break}}}
  if(col.title==null)return null;const g=(r,k)=>col[k]==null?'':(r[col[k]]||'').trim();
  return{col,rows:rows.slice(1).map(r=>({title:g(r,'title'),year:(g(r,'year').match(/\d{4}/)||[])[0]||'',dir:g(r,'dir'),rating:parseFloat(g(r,'rating'))||0,date:csvDate(g(r,'date')),note:g(r,'note'),rw:/^(yes|true|1|y|rewatch)/i.test(g(r,'rw')),type:/^(tv|show|series)/i.test(g(r,'type'))?'tv':/^(movie|film)/i.test(g(r,'type'))?'movie':''})).filter(r=>r.title)}}
function csvPick(f){if(!f)return;if(!D.key)return toast('Add your TMDb API key above first');const rd=new FileReader();
  rd.onload=()=>{const x=csvRows(rd.result);if(!x||!x.rows.length)return toast('No title column found. Use a header row with a "title" or "name" column.');CSVR=x.rows;
    const mx=Math.max(0,...CSVR.map(r=>r.rating)),auto=mx>10?'100':mx>5?'10':mx>0?'5':'10',L=[['title','Title'],['year','Year'],['dir','Director'],['rating','Rating'],['date','Date watched'],['note','Notes'],['rw','Rewatch'],['type','Type']];
    modal(`<h2 style="margin-top:0">Import CSV</h2><p>Found <b>${CSVR.length}</b> rows.</p><p class="mu" style="margin:8px 0">${L.map(([k,n])=>(x.col[k]!=null?'✓ ':'✗ ')+n).join(' · ')}</p><label>Ratings in your file are out of</label><select id="cs" style="width:100%">${[['5','5 (for example 3.5 becomes 7/10)'],['10','10'],['100','100']].map(([k,n])=>`<option value="${k}" ${auto==k?'selected':''}>${n}</option>`).join('')}</select><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="cd" style="width:auto" checked> Skip entries already logged with the same date and rating</label><p class="mu" style="font-size:12px;margin-top:10px">Each row is matched on TMDb by title and year (and director when given). Rows without a usable date are saved as "unknown date". Without a Type column it tries movies first, then TV.</p><div class="acts"><button class="btn" onclick="modal()">Cancel</button><button class="btn p" onclick="csvRun()">Import ${CSVR.length} rows</button></div>`)};
  rd.readAsText(f)}
async function csvFind(r){const q=encodeURIComponent(r.title),y=+r.year||0,dn=s=>s.toLowerCase().replace(/[^a-z0-9]/g,''),want=r.dir.split(/[,;&]| and /i).map(dn).filter(Boolean);
  for(const t of r.type?[r.type]:['movie','tv']){let res=[];
    if(y)res=(await api('/search/'+t,`query=${q}&${t=='movie'?'year':'first_air_date_year'}=${y}`)).results;
    if(!res.length){res=(await api('/search/'+t,'query='+q)).results;if(y)res=res.filter(x=>Math.abs(+(x.release_date||x.first_air_date||'0').slice(0,4)-y)<=1)}
    if(!res.length)continue;let pick=res[0];
    if(want.length&&t=='movie')for(const c of res.slice(0,4)){const cr=await api(`/movie/${c.id}/credits`);if(cr.crew.some(p=>p.job=='Director'&&want.some(w=>dn(p.name).includes(w)||w.includes(dn(p.name))))){pick=c;break}}
    return{type:t,id:pick.id}}
  return null}
async function csvRun(){const sc=+$('#cs').value,skip=$('#cd').checked,rows=CSVR,fd={},dc={},bad=[];let done=0,added=0,dup=0,idx=0;CSVX.stop=0;
  const prog=()=>{const e=$('#cp');if(e)e.textContent=`${done} / ${rows.length} processed · ${added} logs added`};
  modal(`<h2 style="margin-top:0">Importing…</h2><p id="cp" class="mu">0 / ${rows.length} processed</p><p class="mu" style="font-size:12px;margin-top:8px">Keep this tab open. If you stop, everything already imported stays.</p><div class="acts"><button class="btn" onclick="CSVX.stop=1">Stop</button></div>`);
  const one=async(r,t=0)=>{try{const fk=[r.title,r.year,r.type,r.dir].join('|');if(!(fk in fd))fd[fk]=await csvFind(r);const f=fd[fk];if(!f){bad.push(r);return}
      const k=f.type+':'+f.id;if(!dc[k])dc[k]=await detail(f.type,f.id);
      M=dc[k];ens();const s=D.items[key()],rt=r.rating?Math.min(10,Math.max(.5,Math.round(r.rating/sc*20)/2)):0;
      if(skip&&s.logs.some(l=>l.date==r.date&&l.rating==rt)){dup++;return}
      const o={lid:newId(),date:r.date,rating:rt,min:M.type=='tv'?(M.rt*M.eps||M.rt):M.rt,note:r.note,fav:0,rw:r.rw?1:0};if(!r.date)o.unk=1;s.logs.push(o);added++}
    catch(e){if(t<2&&/429|fetch|network/i.test(e.message)){await new Promise(z=>setTimeout(z,1200));return one(r,t+1)}bad.push(r)}};
  const wk2=async()=>{while(!CSVX.stop){const i=idx++;if(i>=rows.length)return;await one(rows[i]);done++;prog();if(done%25==0)save()}};
  await Promise.all([wk2(),wk2(),wk2()]);save();CSVB=bad;
  modal(`<h2 style="margin-top:0">${CSVX.stop?'Import stopped':'Import finished'}</h2><p><b>${added}</b> logs added${dup?' · '+dup+' duplicates skipped':''}${bad.length?' · <b>'+bad.length+'</b> not matched':''}${CSVX.stop?' · '+(rows.length-done)+' not processed':''}</p>${bad.length?`<p class="mu" style="margin-top:10px">Couldn't match these:</p><div style="max-height:200px;overflow:auto;font-size:13px;margin-top:6px">${bad.slice(0,100).map(r=>`<div>${esc(r.title)}${r.year?' ('+esc(r.year)+')':''}</div>`).join('')}${bad.length>100?'<div class="mu">…and more</div>':''}</div>`:''}<div class="acts">${bad.length?'<button class="btn" onclick="csvBad()">Download unmatched</button>':''}<button class="btn p" onclick="modal();location.hash='#/diary'">Open diary</button></div>`)}
function csvBad(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',a=document.createElement('a');a.href=URL.createObjectURL(new Blob([['title,year,director,rating,date watched,notes',...CSVB.map(r=>[r.title,r.year,r.dir,r.rating||'',r.date,r.note].map(q).join(','))].join('\n')],{type:'text/csv'}));a.download='filmstack-unmatched.csv';a.click()}
function csvTpl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['title,year,director,rating,date watched,notes,rewatch\nParasite,2019,Bong Joon-ho,4.5,2026-01-15,Loved it,no\n'],{type:'text/csv'}));a.download='filmstack-template.csv';a.click()}
/* settings */
function settings(){$('#app').innerHTML=`<main class="nar"><h1>Settings</h1><br><div class="panel"><h3>TMDb API key</h3><p class="mu" style="margin-bottom:10px">Paste your TMDb v3 API key or read access token. Stored with your account.</p><div class="acts2"><input id="ak" type="password" value="${esc(D.key)}"><button class="btn p" onclick="D.key=$('#ak').value.trim();save();toast('Key saved')">Save</button></div></div>
<div class="panel"><h3>Timezone</h3><p class="mu" style="margin-bottom:10px">Decides what “today” is when you log. Right now it’s <b style="color:var(--tx)">${esc(tznow())}</b>.</p><select onchange="D.tz=this.value;save();settings()" style="width:100%"><option value="">Device default (${esc(Intl.DateTimeFormat().resolvedOptions().timeZone)})</option>${tzs().map(z=>`<option ${D.tz==z?'selected':''}>${esc(z)}</option>`).join('')}</select></div>
<div class="panel"><h3>Theme</h3><div class="sw">${Object.keys(TH).map(n=>`<button class="swb ${D.theme==n?'on':''}" onclick="setTh('${n}')"><span>${TH[n].map(c=>`<i style="background:${c}"></i>`).join('')}</span>${n}</button>`).join('')}</div><div class="mh">Custom theme${D.theme=='Custom'?' (active)':''}</div><div class="cp">${['Background','Surface','Text','Muted','Accent'].map((n,i)=>`<label>${n}<input type="color" value="${D.custom[i]}" oninput="cu(${i},this.value)"></label>`).join('')}</div></div>
<div class="panel"><h3>Your data</h3><p class="mu" style="margin-bottom:10px">Logs are synced to your account. Export a JSON backup anyway for safekeeping.</p><div class="acts2"><button class="btn" onclick="exp()">Export JSON</button><label class="btn" style="margin:0">Import JSON<input type="file" accept=".json" hidden onchange="imp(this.files[0])"></label><label class="btn" style="margin:0">Import CSV<input type="file" accept=".csv,text/csv" hidden onchange="csvPick(this.files[0]);this.value=''"></label><button class="btn" onclick="csvTpl()">CSV template</button><button class="btn" onclick="out()">Sign out</button><button class="btn" onclick="delAcc()" style="color:#ff4d6d">Delete account</button></div></div></main>`}
const setTh=n=>{D.theme=n;save();applyTheme();settings()},cu=(i,v)=>{D.custom[i]=v;D.theme='Custom';save();applyTheme()};
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...D,key:''})],{type:'application/json'}));a.download=`filmstack-${U}.json`;a.click()}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.items)throw 0;D={...D,...j,key:D.key};save();applyTheme();toast('Imported');settings()}catch(e){toast('Not a valid FilmStack file')}};r.readAsText(f)}
async function delAcc(){if(confirm('Delete this account and all its logs?')){await SB.from('fs_data').delete().eq('uid',UID);await SB.rpc('delete_user')}}
SB.auth.onAuthStateChange((ev,s)=>{
  if((ev=='SIGNED_IN'||ev=='INITIAL_SESSION')&&s?.user){if(U)return;load().then(boot).catch(e=>{$('header').style.display='none';$('#app').innerHTML=`<main><div class="err">${esc(e.message)}</div></main>`})}
  else if(ev=='SIGNED_OUT'||(ev=='INITIAL_SESSION'&&!s)){U=D=null;UID=null;PN=0;syncUi();applyTheme();route()}
});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
